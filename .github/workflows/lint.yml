name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.5"
          args: "format --check --diff"
      # Gate on errors that break the code. The template TODO stubs trip
      # F401, F841, and B007 until they are implemented; Zed still shows those.
      - name: ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.5"
          args: "check --select E9,F63,F7,F82"
